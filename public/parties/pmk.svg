      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
